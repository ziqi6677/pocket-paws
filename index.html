const $=s=>document.querySelector(s),native=!!window.webkit?.messageHandlers?.pet;let kind='cat',sleeping=false,topmost=true,actionTimer,drag=null;try{kind=localStorage.getItem('pocket-pet')||'cat'}catch{}if(!native)document.body.classList.add('web');function send(s){if(native)window.webkit.messageHandlers.pet.postMessage(s)}function say(t){$('#bubble').textContent=t}function sync(){$('#pet').classList.toggle('dog',kind==='dog');$('#name').textContent=(kind==='cat'?'糯米':'布丁')+' · 今天也陪着你';$('[data-action=switch]').textContent=kind==='cat'?'🐾 换成狗狗':'🐾 换成猫猫'}sync();function sparkle(symbol){for(let i=0;i<5;i++){let e=document.createElement('span');e.className='particle';e.textContent=symbol;e.style.left=(75+Math.random()*145)+'px';e.style.top=(105+Math.random()*55)+'px';e.style.animationDelay=i*.08+'s';$('#fx').append(e);setTimeout(()=>e.remove(),1900)}}function wake(){sleeping=false;$('#pet').classList.remove('sleeping');$('[data-action=sleep] span').textContent='休息'}function happy(){clearTimeout(actionTimer);$('#pet').classList.remove('happy');void $('#pet').offsetWidth;$('#pet').classList.add('happy');actionTimer=setTimeout(()=>$('#pet').classList.remove('happy'),1300)}function act(a){if(a!=='menu')$('#menu').classList.remove('open');if(a==='pet'){wake();happy();say(kind==='cat'?'呼噜呼噜～ 最喜欢你啦':'汪！尾巴都要摇成小风扇啦');sparkle('♡')}if(a==='feed'){wake();happy();say('啊呜！吃饱饱，快乐加倍。');sparkle('✦')}if(a==='play'){wake();happy();say('接住啦！再陪我玩一会儿嘛～');let b=document.createElement('div');b.className='ball';b.textContent='🧶';$('#fx').append(b);setTimeout(()=>b.remove(),2900)}if(a==='sleep'){sleeping=!sleeping;$('#pet').classList.toggle('sleeping',sleeping);$('[data-action=sleep] span').textContent=sleeping?'叫醒':'休息';say(sleeping?'呼……我在这里打个小盹。':'睡醒啦！又能陪着你了。')}if(a==='switch'){kind=kind==='cat'?'dog':'cat';wake();sync();try{localStorage.setItem('pocket-pet',kind)}catch{}say(kind==='cat'?'喵～ 我是糯米，请多关照！':'汪～ 我是布丁，很高兴见到你！')}if(a==='menu')$('#menu').classList.toggle('open');if(a==='top'){topmost=!topmost;send(topmost?'top:on':'top:off');$('[data-action=top]').textContent=(topmost?'✓ ':'')+'始终置顶';say(topmost?'我会在最上面陪你。':'好呀，我乖乖待在桌面。')}if(a==='reset'){send('reset');$('#stage').style.left='50%';$('#stage').style.top='50%'}if(a==='quit'){if(native)send('quit');else say('浏览器版本关闭这个标签页就可以啦。')}}document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));document.addEventListener('contextmenu',e=>{e.preventDefault();act('menu')});document.addEventListener('pointerdown',e=>{if(!e.target.closest('#menu')&&!e.target.closest('[data-action=menu]'))$('#menu').classList.remove('open')});$('#pet').addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.screenX,y:e.screenY,moved:false,left:$('#stage').offsetLeft,top:$('#stage').offsetTop};e.currentTarget.setPointerCapture(e.pointerId);send('drag:start')});$('#pet').addEventListener('pointermove',e=>{if(!drag)return;let dx=e.screenX-drag.x,dy=e.screenY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)drag.moved=true;if(drag.moved){if(native)send('drag:move');else{$('#stage').style.left=Math.max(160,Math.min(innerWidth-160,drag.left+dx))+'px';$('#stage').style.top=Math.max(180,Math.min(innerHeight-180,drag.top+dy))+'px'}}});$('#pet').addEventListener('pointerup',()=>{if(drag&&!drag.moved)act('pet');drag=null;send('drag:end')});$('#pet').addEventListener('pointercancel',()=>{drag=null;send('drag:end')});$('#pet').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act('pet')}};setInterval(()=>{if(!sleeping&&!drag)say(['忙你的就好，我会陪着你。','伸个懒腰～ 也记得放松肩膀哦。','今天的你也很棒。','要不要喝一口水呀？'][Math.floor(Math.random()*4)])},45000);
